name: Offline checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B test
      - run: mvn -B -f AI-Agent-MCP/pom.xml package
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AI-agent-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: AI-agent-frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
