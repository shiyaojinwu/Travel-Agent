spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    table: ta_schema_history
  application:
    name: travel-agent
  ai:
    retry:
      max-attempts: 1
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: ${CHAT_MODEL:qwen-plus}
      embedding:
        options:
          model: ${EMBEDDING_MODEL:text-embedding-v2}
    mcp:
      client:
        enabled: ${MCP_ENABLED:false}
        stdio:
          servers-configuration: ${MCP_SERVERS_CONFIG:classpath:mcp-servers.json}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/travel_agent}
    username: ${DB_USERNAME:travel}
    password: ${DB_PASSWORD:}
    hikari:
      connection-timeout: 10000
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:9527}
  servlet:
    context-path: /api
    session:
      cookie:
        http-only: true
        same-site: lax
springdoc:
  swagger-ui:
    path: /swagger-ui.html
knife4j:
  enable: true
search-api:
  api-key: ${SEARCH_API_KEY:}
travel:
  legacy-api-enabled: false
  runtime:
    context-tokens: ${CONTEXT_TOKENS:16000}
    output-tokens: ${OUTPUT_TOKENS:1600}
    run-tokens: ${RUN_TOKEN_BUDGET:50000}
    timeout-seconds: ${RUN_TIMEOUT_SECONDS:180}
    requests-per-hour: ${REQUESTS_PER_HOUR:40}
    mcp-allowed-tools: ${MCP_ALLOWED_TOOLS:}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  rag:
    version: ${KNOWLEDGE_VERSION:v1}
    import-on-startup: ${KNOWLEDGE_IMPORT:false}
    top-k: ${RAG_TOP_K:3}
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.5}
    query-rewrite: ${RAG_QUERY_REWRITE:true}
    dimensions: ${EMBEDDING_DIMENSIONS:1536}
