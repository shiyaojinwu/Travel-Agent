spring:
  application:
    name: travel-agent
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: ${CHAT_MODEL:qwen-plus}
      embedding:
        options:
          model: ${EMBEDDING_MODEL:text-embedding-v2}
    mcp:
      client:
        enabled: ${MCP_ENABLED:false}
        stdio:
          servers-configuration: ${MCP_SERVERS_CONFIG:classpath:mcp-servers.json}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/travel_agent}
    username: ${DB_USERNAME:travel}
    password: ${DB_PASSWORD:}
    hikari:
      connection-timeout: 10000
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:9527}
  servlet:
    context-path: /api
    session:
      cookie:
        http-only: true
        same-site: lax
springdoc:
  swagger-ui:
    path: /swagger-ui.html
knife4j:
  enable: true
search-api:
  api-key: ${SEARCH_API_KEY:}
travel:
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  rag:
    version: ${KNOWLEDGE_VERSION:v1}
    import-on-startup: ${KNOWLEDGE_IMPORT:false}
    top-k: ${RAG_TOP_K:3}
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.5}
    query-rewrite: ${RAG_QUERY_REWRITE:true}
    dimensions: ${EMBEDDING_DIMENSIONS:1536}
